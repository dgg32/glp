# Generated by scripts/build_osi.py from ontology/diabetes-market.ttl. Do not edit.
# Draft Apache Ossie Layer 4 ontology (0.2.0.dev0, apache/ossie@2fd19c7), validated against
# semantic/schema/ossie-ontology-0.2.0.dev0-2fd19c7.schema.json. Snowflake does not read it.
# Not expressed (no rdfs:domain, RDF Data Cube dimensions): prefecture, sexAgeGroup, month, quantity.
version: 0.2.0.dev0
name: DiabetesMarket
description: "The diabetes-market OWL ontology (https://dgg32.github.io/glp/ontology) as a draft Apache Ossie ontology.\
  \ Generated by scripts/build_osi.py; derivation expressions follow the draft expression language and are not checked\
  \ by any engine."
prefixes:
  dm: "https://dgg32.github.io/glp/ontology#"
  skos: "http://www.w3.org/2004/02/skos/core#"
ontology:
- concept: CareSetting
  type: EntityType
  iri: "dm:CareSetting"
  description: "Where a drug was prescribed and dispensed: outpatient with a prescription filled at a community\
    \ pharmacy (院外), outpatient dispensed in the clinic or hospital (院内), or inpatient (入院)."
- concept: GLP1Prescriber
  type: EntityType
  iri: "dm:GLP1Prescriber"
  description: A healthcare professional who wrote at least one prescription for a product containing a substance
    in the GLP-1 receptor agonist class (including narrower classes such as dual GIP/GLP-1 agonists).
  derived_by:
  - "EXISTS ( HealthcareProfessional.writes.for_product.has_active_substance.in_therapeutic_class.broader_transitive.notation\
    \ == 'A10BJ' )"
  extends:
  - HealthcareProfessional
- concept: GLP1Product
  type: EntityType
  iri: "dm:GLP1Product"
  description: A medicinal product containing a substance in the GLP-1 receptor agonist class (including dual GIP/GLP-1
    agonists), alone or in combination, whatever its Japanese therapeutic category (249 or 396).
  derived_by:
  - "EXISTS ( MedicinalProduct.has_active_substance.in_therapeutic_class.broader_transitive.notation == 'A10BJ'\
    \ )"
  extends:
  - MedicinalProduct
- concept: HealthcareProfessional
  type: EntityType
  iri: "dm:HealthcareProfessional"
  description: An individual (NPI type 1) who prescribes drugs reimbursed under Medicare Part D.
  relationships:
  - name: has_primary_specialty
    roles:
    - concept: Specialty
    verbalizes:
    - "{HealthcareProfessional} has primary specialty {Specialty}"
    iri: "dm:hasPrimarySpecialty"
    multiplicity: ManyToOne
  - name: has_specialty
    roles:
    - concept: Specialty
    verbalizes:
    - "{HealthcareProfessional} has specialty {Specialty}"
    iri: "dm:hasSpecialty"
  - name: writes
    roles:
    - concept: Prescription
    verbalizes:
    - "{HealthcareProfessional} writes {Prescription}"
    iri: "dm:writes"
  - name: city
    roles:
    - concept: String
    verbalizes:
    - "{HealthcareProfessional} city {String}"
    iri: "dm:city"
  - name: cms_prescriber_type
    roles:
    - concept: String
    verbalizes:
    - "{HealthcareProfessional} CMS prescriber type {String}"
    iri: "dm:cmsPrescriberType"
    description: Specialty as reported by CMS (Prscrbr_Type), a free-text label that differs from the NUCC code.
  - name: npi
    roles:
    - concept: String
    verbalizes:
    - "{HealthcareProfessional} NPI {String}"
    iri: "dm:npi"
    multiplicity: ManyToOne
    description: US National Provider Identifier (10 digits).
  - name: pseudonymous_id
    roles:
    - concept: String
    verbalizes:
    - "{HealthcareProfessional} pseudonymous ID {String}"
    iri: "dm:pseudonymousId"
    multiplicity: ManyToOne
    description: First 16 hex characters of HMAC-SHA256(secret key, NPI). Stable across runs with the same key;
      not reversible without it.
  - name: state
    roles:
    - concept: String
    verbalizes:
    - "{HealthcareProfessional} state {String}"
    iri: "dm:state"
- concept: Indication
  type: EntityType
  iri: "dm:Indication"
  description: A disease or condition a medicinal product is authorized to treat, as stated in its FDA label, e.g.
    type 2 diabetes mellitus or obesity.
- concept: JapaneseDrugClass
  type: EntityType
  iri: "dm:JapaneseDrugClass"
  description: A three-digit therapeutic category of the Japan Standard Commodity Classification (薬効分類), as used
    by the NHI price list and NDB Open Data, e.g. 396 糖尿病用剤.
- concept: MedicinalProduct
  type: EntityType
  iri: "dm:MedicinalProduct"
  description: "A drug product as named in claims data: in Part D (CMS Brnd_Name, e.g. Jardiance; unbranded generics\
    \ appear under their generic name), or in NDB Open Data, where each strength is its own product with a receipt\
    \ code and a YJ code (e.g. ジャディアンス錠10mg)."
  extends:
  - MedicinalProduct
  relationships:
  - name: has_active_substance
    roles:
    - concept: Substance
    verbalizes:
    - "{MedicinalProduct} has active substance {Substance}"
    iri: "dm:hasActiveSubstance"
  - name: has_indication
    roles:
    - concept: Indication
    verbalizes:
    - "{MedicinalProduct} has indication {Indication}"
    iri: "dm:hasIndication"
  - name: in_japanese_drug_class
    roles:
    - concept: JapaneseDrugClass
    verbalizes:
    - "{MedicinalProduct} in Japanese therapeutic category {JapaneseDrugClass}"
    iri: "dm:inJapaneseDrugClass"
    multiplicity: ManyToOne
  - name: manufactured_by
    roles:
    - concept: Organization
    verbalizes:
    - "{MedicinalProduct} manufactured by {Organization}"
    iri: "dm:manufacturedBy"
  - name: cms_generic_name
    roles:
    - concept: String
    verbalizes:
    - "{MedicinalProduct} CMS generic name {String}"
    iri: "dm:cmsGenericName"
    multiplicity: ManyToOne
    description: "Generic name exactly as spelled in the CMS data (Gnrc_Name), e.g. 'Dapaglifloz Propaned/Metformin'."
  - name: dispensing_unit
    roles:
    - concept: String
    verbalizes:
    - "{MedicinalProduct} dispensing unit {String}"
    iri: "dm:dispensingUnit"
    multiplicity: ManyToOne
    description: The unit in which quantities are counted (錠 tablet, キット kit, 筒 cartridge ...). Quantities in different
      units cannot be added.
  - name: is_combination_product
    roles:
    - concept: Boolean
    verbalizes:
    - "{MedicinalProduct} is combination product {Boolean}"
    iri: "dm:isCombinationProduct"
    multiplicity: ManyToOne
  - name: is_generic
    roles:
    - concept: Boolean
    verbalizes:
    - "{MedicinalProduct} is generic {Boolean}"
    iri: "dm:isGeneric"
    multiplicity: ManyToOne
    description: "Generic (後発医薬品) according to NDB Open Data's 後発品区分; biosimilars count as generics."
  - name: is_originator
    roles:
    - concept: Boolean
    verbalizes:
    - "{MedicinalProduct} is originator {Boolean}"
    iri: "dm:isOriginator"
    multiplicity: ManyToOne
    description: "Flagged 先発品 (originator) in the NHI price list. Neither generic nor originator: older products\
      \ that predate the distinction and unified-name listings."
  - name: nhi_price
    roles:
    - concept: Decimal
    verbalizes:
    - "{MedicinalProduct} NHI price (JPY per unit) {Decimal}"
    iri: "dm:nhiPrice"
    multiplicity: ManyToOne
    description: Reimbursement price in yen per dispensing unit (tablet, pen, ...), as printed in NDB Open Data.
  - name: receipt_code
    roles:
    - concept: String
    verbalizes:
    - "{MedicinalProduct} receipt code {String}"
    iri: "dm:receiptCode"
    multiplicity: ManyToOne
    description: The 9-digit drug code of the claims (receipt) processing system (医薬品コード), the key of NDB Open Data.
  - name: route_of_administration
    roles:
    - concept: String
    verbalizes:
    - "{MedicinalProduct} route of administration {String}"
    iri: "dm:routeOfAdministration"
    multiplicity: ManyToOne
    description: "\"oral\" or \"injection\": the NDB table family (内服 / 注射) the product is reported in. Masking\
      \ thresholds differ: 1,000 for oral, 400 for injection tables."
  - name: yj_code
    roles:
    - concept: String
    verbalizes:
    - "{MedicinalProduct} YJ code {String}"
    iri: "dm:yjCode"
    multiplicity: ManyToOne
    description: The 12-character NHI price list code (薬価基準収載医薬品コード). Characters 1-4 are the therapeutic category,
      1-7 the ingredient, 8 the dosage form.
- concept: Organization
  type: EntityType
  iri: "dm:Organization"
  description: "A company that holds the marketing authorization for a medicinal product: in the US the corporate\
    \ group of the Drugs@FDA application holder (e.g. Boehringer Ingelheim), in Japan the holder named in the NHI\
    \ price list (e.g. 日本ベーリンガーインゲルハイム)."
  extends:
  - Organization
  relationships:
  - name: part_of_corporate_group
    roles:
    - concept: Organization
    verbalizes:
    - "{Organization} part of corporate group {Organization}"
    iri: "dm:partOfCorporateGroup"
    description: Links a national company (e.g. the Japanese marketing authorization holder 日本ベーリンガーインゲルハイム) to
      its corporate group as identified by GLEIF.
- concept: Prefecture
  type: EntityType
  iri: "dm:Prefecture"
  description: "One of Japan's 47 prefectures, identified by its JIS X 0401 code (01-47)."
- concept: Prescription
  type: EntityType
  iri: "dm:Prescription"
  description: "The total Part D claims, fills, days of supply, cost and beneficiaries of one healthcare professional\
    \ for one medicinal product in one data year. One row of the CMS 'Prescribers by Provider and Drug' dataset."
  relationships:
  - name: for_product
    roles:
    - concept: MedicinalProduct
    verbalizes:
    - "{Prescription} for product {MedicinalProduct}"
    iri: "dm:forProduct"
    multiplicity: ManyToOne
  - name: prescribed_by
    roles:
    - concept: HealthcareProfessional
    verbalizes:
    - "{Prescription} prescribed by {HealthcareProfessional}"
    iri: "dm:prescribedBy"
    multiplicity: ManyToOne
  - name: beneficiary_count_suppressed
    roles:
    - concept: Boolean
    verbalizes:
    - "{Prescription} beneficiary count suppressed {Boolean}"
    iri: "dm:beneficiaryCountSuppressed"
    multiplicity: ManyToOne
  - name: data_year
    roles:
    - concept: Integer
    verbalizes:
    - "{Prescription} data year {Integer}"
    iri: "dm:dataYear"
    multiplicity: ManyToOne
  - name: total30_day_fills
    roles:
    - concept: Decimal
    verbalizes:
    - "{Prescription} total 30-day fills {Decimal}"
    iri: "dm:total30DayFills"
    multiplicity: ManyToOne
    description: Claims standardized to 30-day fills; a 90-day fill counts as 3.0 (CMS Tot_30day_Fills).
  - name: total_beneficiaries
    roles:
    - concept: Integer
    verbalizes:
    - "{Prescription} total beneficiaries {Integer}"
    iri: "dm:totalBeneficiaries"
    multiplicity: ManyToOne
    requires:
    - Prescription.total_beneficiaries >= 0
    description: Number of distinct Medicare beneficiaries (CMS Tot_Benes). Absent when 1-10, to protect privacy.
  - name: total_claims
    roles:
    - concept: Integer
    verbalizes:
    - "{Prescription} total claims {Integer}"
    iri: "dm:totalClaims"
    multiplicity: ManyToOne
    requires:
    - Prescription.total_claims >= 0
    description: Number of Part D claims, including refills (CMS Tot_Clms).
  - name: total_day_supply
    roles:
    - concept: Integer
    verbalizes:
    - "{Prescription} total day supply {Integer}"
    iri: "dm:totalDaySupply"
    multiplicity: ManyToOne
    requires:
    - Prescription.total_day_supply >= 0
  - name: total_drug_cost
    roles:
    - concept: Decimal
    verbalizes:
    - "{Prescription} total drug cost (USD) {Decimal}"
    iri: "dm:totalDrugCost"
    multiplicity: ManyToOne
    description: Aggregate gross drug cost paid by Part D plan, beneficiary and other payers, in US dollars (CMS
      Tot_Drug_Cst).
- concept: QuantitySlice
  type: EntityType
  iri: "dm:QuantitySlice"
  description: "The quantity of one medicinal product dispensed in one care setting in one NDB Open Data release,\
    \ broken down by one dimension (prefecture, month or sex-age band). One row of one NDB table; its cells are\
    \ the qb:observation values."
  relationships:
  - name: about_product
    roles:
    - concept: MedicinalProduct
    verbalizes:
    - "{QuantitySlice} about product {MedicinalProduct}"
    iri: "dm:aboutProduct"
    multiplicity: ManyToOne
  - name: care_setting
    roles:
    - concept: CareSetting
    verbalizes:
    - "{QuantitySlice} care setting {CareSetting}"
    iri: "dm:careSetting"
    multiplicity: ManyToOne
  - name: total_quantity
    roles:
    - concept: Decimal
    verbalizes:
    - "{QuantitySlice} total quantity {Decimal}"
    iri: "dm:totalQuantity"
    multiplicity: ManyToOne
    description: "The national total of the row (総計). Unmasked unless the whole product is below the masking threshold\
      \ in that care setting; then the slice carries sdmx-attribute:confStatus instead."
- concept: SGLT2Prescriber
  type: EntityType
  iri: "dm:SGLT2Prescriber"
  description: A healthcare professional who wrote at least one prescription for a product containing a substance
    in the SGLT2 inhibitor class.
  derived_by:
  - "EXISTS ( HealthcareProfessional.writes.for_product.has_active_substance.in_therapeutic_class.broader_transitive.notation\
    \ == 'A10BK' )"
  extends:
  - HealthcareProfessional
- concept: SGLT2Product
  type: EntityType
  iri: "dm:SGLT2Product"
  description: A medicinal product containing a substance in the SGLT2 inhibitor class, alone or in combination.
  derived_by:
  - "EXISTS ( MedicinalProduct.has_active_substance.in_therapeutic_class.broader_transitive.notation == 'A10BK'\
    \ )"
  extends:
  - MedicinalProduct
- concept: SexAgeGroup
  type: EntityType
  iri: "dm:SexAgeGroup"
  description: A sex combined with a five-year age band (0-4 ... 95-99, 100+), as NDB Open Data reports them.
  relationships:
  - name: min_age
    roles:
    - concept: Integer
    verbalizes:
    - "{SexAgeGroup} minimum age {Integer}"
    iri: "dm:minAge"
    multiplicity: ManyToOne
    description: Lower bound of the age band in years (65 for 65-69).
- concept: Specialty
  type: EntityType
  iri: "dm:Specialty"
  description: A concept from the NUCC Health Care Provider Taxonomy, published as a SKOS concept scheme.
- concept: Substance
  type: EntityType
  iri: "dm:Substance"
  description: An active substance of a medicinal product, e.g. empagliflozin. A combination product has more than
    one.
  extends:
  - Substance
  relationships:
  - name: in_therapeutic_class
    roles:
    - concept: TherapeuticClass
    verbalizes:
    - "{Substance} in therapeutic class {TherapeuticClass}"
    iri: "dm:inTherapeuticClass"
- concept: TherapeuticClass
  type: EntityType
  iri: "dm:TherapeuticClass"
  description: A concept in the therapeutic class scheme (e.g. SGLT2 inhibitors). The hierarchy itself is maintained
    as a SKOS concept scheme, not as OWL subclasses.
  relationships:
  - name: notation
    roles:
    - concept: String
    verbalizes:
    - "{TherapeuticClass} has ATC code {String}"
    multiplicity: ManyToOne
    iri: "skos:notation"
  - name: broader
    roles:
    - concept: TherapeuticClass
      name: parent
    verbalizes:
    - "{TherapeuticClass} has broader class {TherapeuticClass:parent}"
    iri: "skos:broader"
  - name: broader_transitive
    roles:
    - concept: TherapeuticClass
      name: ancestor
    verbalizes:
    - "{TherapeuticClass} is within {TherapeuticClass:ancestor}"
    iri: "skos:broaderTransitive"
    derived_by:
    - TherapeuticClass == ancestor
    - TherapeuticClass.broader(ancestor)
    - TherapeuticClass.broader.broader_transitive(ancestor)
