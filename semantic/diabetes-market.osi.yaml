      ai_context: "Synonyms: pseudonymous ID, 仮名ID, 假名化ID"
      custom_extensions:
      - vendor_name: SNOWFLAKE
        data: "{\"synonyms\": [\"pseudonymous ID\", \"仮名ID\", \"假名化ID\"]}"
    - name: cms_prescriber_type
