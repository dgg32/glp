# Generated by scripts/build_osi.py from the ontology. Do not edit.
# Apache Ossie (OSI) 0.1.1, validated against semantic/schema/osi-0.1.1.schema.json.
version: 0.1.1
semantic_model:
- name: DIABETES_MARKET_OSI
  description: "Type 2 diabetes drug prescribing, generated from the diabetes-market ontology 0.5.1. Medicare Part\
    \ D, Connecticut, data year 2024: mostly people aged 65 and over. Counts are claims (fills and refills), not\
    \ patients. CMS omits prescriber/product rows with fewer than 11 claims. Costs are gross, before rebates. Prescribers\
    \ are pseudonyms; report aggregates only."
  ai_context: "Use total_claims and total_drug_cost for overall volume. For anything by therapeutic class use the\
    \ class_* metrics and filter or group by one class: a combination product counts in every class it belongs to,\
    \ so class figures never add up to the total. 'By drug class' means therapeutic_class.is_drug_class = TRUE.\
    \ Cost comparisons between classes: also show class_cost_per_30day_fill, the fair comparison when fill lengths\
    \ differ. For market shares by company divide company_claims_allocated by its sum over all companies of the\
    \ class. Names exist in English, Japanese (*_ja) and Chinese (*_zh): answer with the names in the language of\
    \ the question."
  datasets:
  - name: prescription
    source: GLP.SEMANTIC.SV_PRESCRIPTION
    primary_key:
    - PRESCRIPTION_ID
    description: "The total Part D claims, fills, days of supply, cost and beneficiaries of one healthcare professional\
      \ for one medicinal product in one data year. One row of the CMS 'Prescribers by Provider and Drug' dataset."
    fields:
    - name: prescription_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: PRESCRIPTION_ID
      dimension:
        is_time: false
      description: "Key: data year / prescriber / product."
    - name: prescriber_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: PRESCRIBER_ID
      dimension:
        is_time: false
      description: Pseudonymous prescriber key.
    - name: product_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: PRODUCT_ID
      dimension:
        is_time: false
      description: Product key.
    - name: data_year
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: DATA_YEAR
      dimension:
        is_time: false
      description: Data year. Only 2024 is loaded.
      ai_context: "Synonyms: データ年, 数据年份"
      custom_extensions:
      - vendor_name: SNOWFLAKE
        data: "{\"synonyms\": [\"データ年\", \"数据年份\"]}"
    - name: beneficiaries_suppressed
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: BENEFICIARIES_SUPPRESSED
      dimension:
        is_time: false
      description: Beneficiary count suppressed.
      ai_context: "Synonyms: beneficiary count suppressed, 受給者数秘匿, 受益人数已隐去"
      custom_extensions:
      - vendor_name: SNOWFLAKE
        data: "{\"synonyms\": [\"beneficiary count suppressed\", \"受給者数秘匿\", \"受益人数已隐去\"]}"
    - name: claims
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: CLAIMS
      description: Number of Part D claims, including refills (CMS Tot_Clms).
    - name: fills_30day
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: FILLS_30DAY
      description: Claims standardized to 30-day fills; a 90-day fill counts as 3.0 (CMS Tot_30day_Fills).
    - name: day_supply
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: DAY_SUPPLY
      description: Total day supply.
    - name: drug_cost
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: DRUG_COST
      description: Aggregate gross drug cost paid by Part D plan, beneficiary and other payers, in US dollars (CMS
        Tot_Drug_Cst).
    - name: beneficiaries
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: BENEFICIARIES
      description: Number of distinct Medicare beneficiaries (CMS Tot_Benes). Absent when 1-10, to protect privacy.
      ai_context: "Synonyms: total beneficiaries, 受給者数, 受益人数"
      custom_extensions:
      - vendor_name: SNOWFLAKE
        data: "{\"synonyms\": [\"total beneficiaries\", \"受給者数\", \"受益人数\"]}"
    ai_context: "Synonyms: prescription aggregate, 処方集計, 处方汇总"
    custom_extensions:
    - vendor_name: SNOWFLAKE
      data: "{\"synonyms\": [\"prescription aggregate\", \"処方集計\", \"处方汇总\"]}"
  - name: prescription_class
    source: GLP.SEMANTIC.SV_PRESCRIPTION_CLASS
    primary_key:
    - PRESCRIPTION_ID
    - CLASS_ID
    description: "Claims attributed to therapeutic classes: one row per prescription and class of any of the product's\
      \ substances, including all broader classes (skos:broader*). A combination product counts in each of its classes,\
      \ so never add claims across classes; filter or group by one class."
    fields:
    - name: prescription_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: PRESCRIPTION_ID
      dimension:
        is_time: false
      description: Prescription key.
    - name: class_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: CLASS_ID
      dimension:
        is_time: false
      description: Therapeutic class key.
    - name: claims
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: CLAIMS
      description: Number of Part D claims, including refills (CMS Tot_Clms).
    - name: fills_30day
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: FILLS_30DAY
      description: Claims standardized to 30-day fills; a 90-day fill counts as 3.0 (CMS Tot_30day_Fills).
    - name: drug_cost
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: DRUG_COST
      description: Aggregate gross drug cost paid by Part D plan, beneficiary and other payers, in US dollars (CMS
        Tot_Drug_Cst).
  - name: prescription_class_company
    source: GLP.SEMANTIC.SV_PRESCRIPTION_CLASS_COMPANY
    primary_key:
    - PRESCRIPTION_ID
    - CLASS_ID
    - ORGANIZATION_KEY
    description: "Claims by therapeutic class and manufacturer, for market shares: one row per prescription, class\
      \ and marketing authorization holder. Unbranded generics have no single manufacturer. A product with two holders\
      \ (Byetta) counts for each."
    fields:
    - name: prescription_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: PRESCRIPTION_ID
      dimension:
        is_time: false
      description: Prescription key.
    - name: class_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: CLASS_ID
      dimension:
        is_time: false
      description: Therapeutic class key.
    - name: manufacturer
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: MANUFACTURER
      dimension:
        is_time: false
      description: "Manufactured by. Company name, or 'generic (no single manufacturer)'."
      ai_context: "Synonyms: manufactured by"
      custom_extensions:
      - vendor_name: SNOWFLAKE
        data: "{\"synonyms\": [\"manufactured by\"]}"
    - name: claims
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: CLAIMS
      description: Number of Part D claims, including refills (CMS Tot_Clms).
    - name: claims_allocated
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: CLAIMS_ALLOCATED
      description: "Claims divided equally among the product's marketing authorization holders, so that the companies\
        \ of a class add up to the class's claims. Use for market shares."
    - name: drug_cost
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: DRUG_COST
      description: Aggregate gross drug cost paid by Part D plan, beneficiary and other payers, in US dollars (CMS
        Tot_Drug_Cst).
  - name: prescriber
    source: GLP.SEMANTIC.SV_PRESCRIBER
    primary_key:
    - PRESCRIBER_ID
    description: An individual (NPI type 1) who prescribes drugs reimbursed under Medicare Part D.
    fields:
    - name: prescriber_id
      expression:
        dialects:
        - dialect: ANSI_SQL
