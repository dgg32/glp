        - dialect: ANSI_SQL
          expression: CITY
      dimension:
        is_time: false
      description: City.
      ai_context: "Synonyms: 市区町村, 城市"
      custom_extensions:
      - vendor_name: SNOWFLAKE
        data: "{\"synonyms\": [\"市区町村\", \"城市\"]}"
    - name: state
      expression:
        dialects:
