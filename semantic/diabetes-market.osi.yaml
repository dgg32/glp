  relationships:
  - name: prescription_to_prescriber
    from: prescription
    to: prescriber
    from_columns:
    - PRESCRIBER_ID
    to_columns:
    - PRESCRIBER_ID
  - name: prescription_to_product
    from: prescription
    to: product
    from_columns:
    - PRODUCT_ID
    to_columns:
    - PRODUCT_ID
  - name: prescriber_to_specialty
    from: prescriber
    to: specialty
    from_columns:
    - PRIMARY_SPECIALTY_CODE
    to_columns:
    - SPECIALTY_CODE
  - name: prescription_class_to_prescription
    from: prescription_class
    to: prescription
    from_columns:
    - PRESCRIPTION_ID
    to_columns:
    - PRESCRIPTION_ID
  - name: prescription_class_to_therapeutic_class
    from: prescription_class
    to: therapeutic_class
    from_columns:
    - CLASS_ID
    to_columns:
    - CLASS_ID
  - name: prescription_class_company_to_prescription
    from: prescription_class_company
    to: prescription
    from_columns:
    - PRESCRIPTION_ID
    to_columns:
    - PRESCRIPTION_ID
  - name: prescription_class_company_to_therapeutic_class
    from: prescription_class_company
    to: therapeutic_class
    from_columns:
    - CLASS_ID
    to_columns:
    - CLASS_ID
  - name: prescription_class_company_to_organization
    from: prescription_class_company
    to: organization
    from_columns:
    - ORGANIZATION_ID
    to_columns:
    - ORGANIZATION_ID
  metrics:
  - name: total_claims
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(prescription.claims)
    description: Number of Part D claims, including refills (CMS Tot_Clms). All Part D claims.
    ai_context: "Synonyms: total claims, 処方件数, 处方次数"
    custom_extensions:
    - vendor_name: SNOWFLAKE
      data: "{\"synonyms\": [\"total claims\", \"処方件数\", \"处方次数\"]}"
  - name: total_drug_cost
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(prescription.drug_cost)
    description: Aggregate gross drug cost paid by Part D plan, beneficiary and other payers, in US dollars (CMS
      Tot_Drug_Cst). All gross drug cost in USD.
    ai_context: "Synonyms: total drug cost (USD), 薬剤費総額（米ドル）, 药品总费用（美元）"
    custom_extensions:
    - vendor_name: SNOWFLAKE
      data: "{\"synonyms\": [\"total drug cost (USD)\", \"薬剤費総額（米ドル）\", \"药品总费用（美元）\"]}"
  - name: total_30day_fills
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(prescription.fills_30day)
    description: Claims standardized to 30-day fills; a 90-day fill counts as 3.0 (CMS Tot_30day_Fills).
    ai_context: "Synonyms: total 30-day fills, 30日換算処方数, 30天折算处方数"
    custom_extensions:
    - vendor_name: SNOWFLAKE
      data: "{\"synonyms\": [\"total 30-day fills\", \"30日換算処方数\", \"30天折算处方数\"]}"
  - name: total_day_supply
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(prescription.day_supply)
    ai_context: "Synonyms: total day supply, 総処方日数, 总供药天数"
    custom_extensions:
    - vendor_name: SNOWFLAKE
      data: "{\"synonyms\": [\"total day supply\", \"総処方日数\", \"总供药天数\"]}"
  - name: cost_per_claim
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(prescription.drug_cost) / NULLIF(SUM(prescription.claims), 0)
    description: Gross drug cost per claim in USD.
  - name: prescriber_count
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: COUNT(DISTINCT prescription.prescriber_id)
    description: Number of distinct prescribers with at least one claim (Part D rows of 11 claims or more).
  - name: class_claims
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(prescription_class.claims)
    description: Claims of products in a therapeutic class (including narrower classes). Filter or group by one
      class.
  - name: class_drug_cost
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(prescription_class.drug_cost)
    description: Gross drug cost in USD of products in a therapeutic class. Filter or group by one class.
  - name: class_cost_per_claim
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(prescription_class.drug_cost) / NULLIF(SUM(prescription_class.claims), 0)
    description: Gross drug cost per claim in USD within a therapeutic class.
  - name: class_cost_per_30day_fill
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(prescription_class.drug_cost) / NULLIF(SUM(prescription_class.fills_30day), 0)
    description: "Gross drug cost per 30-day fill in USD within a therapeutic class: compares classes fairly when\
      \ fill lengths differ."
  - name: sglt2_claims
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: "SUM(CASE WHEN prescription_class.class_id = 'SGLT2Inhibitor' THEN prescription_class.claims\
          \ ELSE 0 END)"
    description: "Claims of products in the class Sodium-glucose co-transporter 2 (SGLT2) inhibitors (from the definition\
      \ of dm:SGLT2Prescriber)."
  - name: glp1_claims
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: "SUM(CASE WHEN prescription_class.class_id = 'GLP1ReceptorAgonist' THEN prescription_class.claims\
          \ ELSE 0 END)"
    description: "Claims of products in the class Glucagon-like peptide-1 (GLP-1) analogues, including dual GIP/GLP-1\
      \ agonists (from the definition of dm:GLP1Prescriber)."
  - name: sglt2_share_vs_glp1
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: "SUM(CASE WHEN prescription_class.class_id = 'SGLT2Inhibitor' THEN prescription_class.claims\
          \ ELSE 0 END) / NULLIF(SUM(CASE WHEN prescription_class.class_id = 'SGLT2Inhibitor' THEN prescription_class.claims\
          \ ELSE 0 END) + SUM(CASE WHEN prescription_class.class_id = 'GLP1ReceptorAgonist' THEN prescription_class.claims\
          \ ELSE 0 END), 0)"
    description: SGLT2 inhibitor claims as a fraction of SGLT2 inhibitor plus GLP-1 receptor agonist claims (0 to
      1).
  - name: company_claims
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(prescription_class_company.claims)
    description: Claims of products by a manufacturer within a therapeutic class. Filter or group by one class.
      A product with two marketing authorization holders counts fully for each, so do not divide by the sum over
      companies.
  - name: company_claims_allocated
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(prescription_class_company.claims_allocated)
    description: "Claims by manufacturer within a therapeutic class, with a product's claims split equally among\
      \ its marketing authorization holders: the companies of a class add up to the class's claims. Market share\
      \ = company_claims_allocated / its sum over all companies of the class."
  - name: company_drug_cost
    expression:
      dialects:
      - dialect: ANSI_SQL
        expression: SUM(prescription_class_company.drug_cost)
    description: Gross drug cost in USD by manufacturer within a therapeutic class.
  custom_extensions:
  - vendor_name: SNOWFLAKE
    data: "{\"module_custom_instructions\": {\"sql_generation\": \"Use total_claims and total_drug_cost for overall\
      \ volume. For anything by therapeutic class use the class_* metrics and filter or group by one class: a combination\
      \ product counts in every class it belongs to, so class figures never add up to the total. 'By drug class'\
      \ means therapeutic_class.is_drug_class = TRUE. Cost comparisons between classes: also show class_cost_per_30day_fill,\
      \ the fair comparison when fill lengths differ. For market shares by company divide company_claims_allocated\
      \ by its sum over all companies of the class. Names exist in English, Japanese (*_ja) and Chinese (*_zh):\
      \ answer with the names in the language of the question.\"}, \"verified_queries\": [{\"name\": \"sglt2_vs_glp1_by_specialty\"\
      , \"question\": \"What share of SGLT2 inhibitor plus GLP-1 receptor agonist claims are SGLT2 inhibitors, by\
      \ prescriber specialty?\", \"sql\": \"SELECT * FROM SEMANTIC_VIEW(GLP.SEMANTIC.DIABETES_MARKET_OSI DIMENSIONS\
      \ specialty.specialty_name METRICS sglt2_claims, glp1_claims, sglt2_share_vs_glp1) ORDER BY sglt2_claims +\
      \ glp1_claims DESC\", \"verified_at\": 1793404800, \"use_as_onboarding_question\": true}, {\"name\": \"cost_per_claim_by_drug_class\"\
      , \"question\": \"What is the cost per claim and per 30-day fill by drug class, for single-ingredient products?\"\
      , \"sql\": \"SELECT * FROM SEMANTIC_VIEW(GLP.SEMANTIC.DIABETES_MARKET_OSI DIMENSIONS therapeutic_class.class_name\
      \ METRICS class_claims, class_drug_cost, class_cost_per_claim, class_cost_per_30day_fill WHERE therapeutic_class.is_drug_class\
      \ AND NOT product.is_combination) ORDER BY class_cost_per_30day_fill DESC\", \"verified_at\": 1793404800,\
      \ \"use_as_onboarding_question\": true}, {\"name\": \"market_share_by_manufacturer\", \"question\": \"What\
      \ is each manufacturer's share of SGLT2 inhibitor and GLP-1 receptor agonist claims?\", \"sql\": \"SELECT\
      \ class_name, manufacturer, company_claims, company_claims_allocated / SUM(company_claims_allocated) OVER\
      \ (PARTITION BY class_name) AS claim_share FROM SEMANTIC_VIEW(GLP.SEMANTIC.DIABETES_MARKET_OSI DIMENSIONS\
      \ therapeutic_class.class_name, prescription_class_company.manufacturer METRICS company_claims, company_claims_allocated\
      \ WHERE prescription_class_company.class_id IN ('SGLT2Inhibitor', 'GLP1ReceptorAgonist')) ORDER BY class_name,\
      \ claim_share DESC\", \"verified_at\": 1793404800, \"use_as_onboarding_question\": false}, {\"name\": \"sglt2_by_specialty_ja\"\
      , \"question\": \"SGLT2阻害薬を処方している専門分野は？\", \"sql\": \"SELECT * FROM SEMANTIC_VIEW(GLP.SEMANTIC.DIABETES_MARKET_OSI\
      \ DIMENSIONS specialty.specialty_name_ja METRICS class_claims WHERE therapeutic_class.class_name_ja = 'SGLT2阻害薬')\
      \ ORDER BY class_claims DESC LIMIT 10\", \"verified_at\": 1793404800, \"use_as_onboarding_question\": true},\
      \ {\"name\": \"prescriber_overlap\", \"question\": \"How many prescribers write SGLT2 inhibitors, GLP-1 receptor\
      \ agonists, or both?\", \"sql\": \"SELECT * FROM SEMANTIC_VIEW(GLP.SEMANTIC.DIABETES_MARKET_OSI DIMENSIONS\
      \ prescriber.is_sglt2_prescriber, prescriber.is_glp1_prescriber METRICS prescriber_count) ORDER BY 1, 2\"\
      , \"verified_at\": 1793404800, \"use_as_onboarding_question\": false}]}"
