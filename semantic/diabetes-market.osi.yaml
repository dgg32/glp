        data: "{\"synonyms\": [\"GLP-1 receptor agonist prescriber\", \"GLP-1受容体作動薬処方医\", \"GLP-1受体激动剂处方者\"]}"
    ai_context: "Synonyms: healthcare professional, 医療従事者, 医疗专业人员"
    custom_extensions:
    - vendor_name: SNOWFLAKE
      data: "{\"synonyms\": [\"healthcare professional\", \"医療従事者\", \"医疗专业人员\"]}"
  - name: specialty
    source: GLP.SEMANTIC.SV_SPECIALTY
