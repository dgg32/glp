      description: A healthcare professional who wrote at least one prescription for a product containing a substance
        in the SGLT2 inhibitor class.
      ai_context: "Synonyms: SGLT2 inhibitor prescriber, SGLT2阻害薬処方医, SGLT2抑制剂处方者"
      custom_extensions:
      - vendor_name: SNOWFLAKE
        data: "{\"synonyms\": [\"SGLT2 inhibitor prescriber\", \"SGLT2阻害薬処方医\", \"SGLT2抑制剂处方者\"]}"
    - name: is_glp1_prescriber
      expression:
