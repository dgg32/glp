version: 0.1.1
semantic_model:
  - name: JAPAN_MARKET_OSI
    description: "Diabetes drugs dispensed in Japan, generated from the diabetes-market ontology 0.5.2. NDB Open Data, 11th release: FY2024 (April 2024 - March 2025), all of Japan, all ages. Quantities are dispensed tablets, pens or kits, not patients or prescriptions, and cannot be added across products; values are quantity times the NHI price (price list of 2026-09-02), in yen. Cells below 1,000 (oral) or 400 (injection) are masked. The prefecture is where the claim was issued. No prescribers or specialties exist for Japan."
    ai_context: "Answer in yen (value_yen metrics), never by adding quantities across products. The four fact datasets are four breakdowns of the same national figures: never combine them; use national_value unless the question is by prefecture, month, or sex and age. Every fact row is one product in one therapeutic class, broader classes included: for all diabetes drugs use the *_all metrics, which count each product once (they handle the top class internally: never filter class_id yourself to get all drugs); for a class, filter or group by one class. 'By drug class' means therapeutic_class.is_drug_class = TRUE. A class's share of the market: market_share by class. A company's market share in a class: class_market_share with product.company and that class (never divide by the company's own total). 'Single-ingredient' means NOT product.is_combination. Prefecture, month and age figures are lower bounds (masked cells). Names exist in English, Japanese (*_ja) and Chinese (*_zh): answer with the names in the language of the question."
    datasets:
      - name: CARE_SETTING
        source: GLP.SEMANTIC.SV_JP_CARE_SETTING
        primary_key:
          - CARE_SETTING_ID
        description: "Where a drug was prescribed and dispensed: outpatient with a prescription filled at a community pharmacy (院外), outpatient dispensed in the clinic or hospital (院内), or inpatient (入院)."
        fields:
          - name: CARE_SETTING_ID
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: CARE_SETTING_ID
            dimension: {}
            description: Care setting key.
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
          - name: CARE_SETTING_NAME
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: CARE_SETTING_NAME
            dimension: {}
            description: "Care setting name in English. Values: inpatient; outpatient; outpatient, community pharmacy; outpatient, dispensed in-house."
            ai_context: "Synonyms: care setting"
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"synonyms\": [\"care setting\"]}"
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
          - name: CARE_SETTING_NAME_JA
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: CARE_SETTING_NAME_JA
            dimension: {}
            description: "Care setting name in Japanese. Values: 入院; 外来; 外来（院内）; 外来（院外）."
            ai_context: "Synonyms: 診療区分"
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"synonyms\": [\"診療区分\"]}"
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
          - name: CARE_SETTING_NAME_ZH
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: CARE_SETTING_NAME_ZH
            dimension: {}
            description: Care setting name in Chinese.
            ai_context: "Synonyms: 诊疗类别"
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"synonyms\": [\"诊疗类别\"]}"
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
      - name: JP_DRUG_CLASS
        source: GLP.SEMANTIC.SV_JP_JP_DRUG_CLASS
        primary_key:
          - JP_CLASS_CODE
        description: "A three-digit therapeutic category of the Japan Standard Commodity Classification (薬効分類), as used by the NHI price list and NDB Open Data, e.g. 396 糖尿病用剤. Joined as the product's category. Most GLP-1 drugs are filed under 249, not 396."
        fields:
          - name: JP_CLASS_CODE
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: JP_CLASS_CODE
            dimension: {}
            description: "Three-digit code, e.g. 396."
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
          - name: JP_CLASS_NAME
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: JP_CLASS_NAME
            dimension: {}
            description: Japanese therapeutic category name in English.
            ai_context: "Synonyms: Japanese therapeutic category"
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"synonyms\": [\"Japanese therapeutic category\"]}"
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
          - name: JP_CLASS_NAME_JA
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: JP_CLASS_NAME_JA
            dimension: {}
            description: "Japanese therapeutic category name in Japanese. Values: その他のホルモン剤（抗ホルモン剤を含む。）; 糖尿病用剤."
            ai_context: "Synonyms: 薬効分類"
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"synonyms\": [\"薬効分類\"]}"
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
          - name: JP_CLASS_NAME_ZH
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: JP_CLASS_NAME_ZH
            dimension: {}
            description: Japanese therapeutic category name in Chinese.
            ai_context: "Synonyms: 日本药效分类"
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"synonyms\": [\"日本药效分类\"]}"
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
      - name: MONTH_VALUE
        source: GLP.SEMANTIC.SV_JP_MONTH_VALUE
        primary_key:
          - PRODUCT_ID
          - CARE_SETTING_ID
          - MONTH
          - CLASS_ID
        description: "Values by month of care. Masked cells are left out, so sums are lower bounds. One row per product and therapeutic class of any of its substances, including all broader classes (skos:broader*): filter or group by one class, or use the *_all metrics, which count each product once (the top class)."
        fields:
          - name: CARE_SETTING_ID
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: CARE_SETTING_ID
            dimension: {}
            description: "outpatient-external (community pharmacy, 院外), outpatient-internal (dispensed in-house, 院内) or inpatient (入院)."
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
          - name: CLASS_ID
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: CLASS_ID
            dimension: {}
            description: Therapeutic class key.
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
          - name: PRODUCT_ID
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: PRODUCT_ID
            dimension: {}
            description: Product key (receipt code).
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
          - name: MONTH
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: MONTH
            dimension:
              is_time: true
            description: "Month of care. First day of the month of care, 2024-04 to 2025-03."
            ai_context: "Synonyms: month of care, 診療月"
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"synonyms\": [\"month of care\", \"診療月\"]}"
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
          - name: GENERIC_QUANTITY
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: GENERIC_QUANTITY
            description: "Quantity of products flagged generic (reimbursement definition), else 0. Comparable with quantity within one class only."
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
          - name: QUANTITY
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: QUANTITY
            description: Dispensed quantity in the product's dispensing unit. Absent when NDB masked the cell; the observation then carries sdmx-attribute:confStatus sdmx-code:confStatus-C.
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
          - name: VALUE_YEN
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: VALUE_YEN
            description: "Quantity times the NHI price, in yen."
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
      - name: NATIONAL_VALUE
        source: GLP.SEMANTIC.SV_JP_NATIONAL_VALUE
        primary_key:
          - PRODUCT_ID
          - CARE_SETTING_ID
          - CLASS_ID
        description: "National totals (総計) per product and care setting, FY2024. Use it unless the question is by prefecture, month or sex and age. Products whose whole row NDB masked are left out. One row per product and therapeutic class of any of its substances, including all broader classes (skos:broader*): filter or group by one class, or use the *_all metrics, which count each product once (the top class)."
        fields:
          - name: CARE_SETTING_ID
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: CARE_SETTING_ID
            dimension: {}
            description: "outpatient-external (community pharmacy, 院外), outpatient-internal (dispensed in-house, 院内) or inpatient (入院)."
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
          - name: CLASS_ID
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: CLASS_ID
            dimension: {}
            description: Therapeutic class key.
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
          - name: PRODUCT_ID
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: PRODUCT_ID
            dimension: {}
            description: Product key (receipt code).
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
          - name: CLASS_TOTAL_VALUE_YEN
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: CLASS_TOTAL_VALUE_YEN
            description: "The national value of the row's class (all products, all care settings), repeated on every row: the denominator of class_market_share."
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
          - name: MARKET_TOTAL_VALUE_YEN
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: MARKET_TOTAL_VALUE_YEN
            description: "The national value of all diabetes drugs, repeated on every row: the denominator of market_share."
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
          - name: QUANTITY
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: QUANTITY
            description: The national total of the row (総計). Unmasked unless the whole product is below the masking threshold in that care setting; then the slice carries sdmx-attribute:confStatus instead.
            ai_context: "Synonyms: total quantity, 総計（処方数量）"
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"synonyms\": [\"total quantity\", \"総計（処方数量）\"]}"
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
          - name: VALUE_YEN
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: VALUE_YEN
            description: "Quantity times the NHI price, in yen."
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
      - name: PREFECTURE
        source: GLP.SEMANTIC.SV_JP_PREFECTURE
        primary_key:
          - PREFECTURE_CODE
        description: "One of Japan's 47 prefectures, identified by its JIS X 0401 code (01-47)."
        fields:
          - name: PREFECTURE_CODE
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: PREFECTURE_CODE
            dimension: {}
            description: "JIS X 0401 code, 01-47."
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
          - name: PREFECTURE_NAME
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: PREFECTURE_NAME
            dimension: {}
            description: Prefecture name in English.
            ai_context: "Synonyms: prefecture"
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"synonyms\": [\"prefecture\"]}"
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
          - name: PREFECTURE_NAME_JA
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: PREFECTURE_NAME_JA
            dimension: {}
            description: "Prefecture name in Japanese. Values: 三重県; 京都府; 佐賀県; 兵庫県; 北海道; 千葉県; 和歌山県; 埼玉県; 大分県; 大阪府; 奈良県; 宮城県; 宮崎県; 富山県; 山口県; 山形県; 山梨県; 岐阜県; 岡山県; 岩手県; 島根県; 広島県; 徳島県; 愛媛県; 愛知県; 新潟県; 東京都; 栃木県; 沖縄県; 滋賀県; 熊本県; 石川県; 神奈川県; 福井県; 福岡県; 福島県; 秋田県; 群馬県; 茨城県; 長崎県; 長野県; 青森県; 静岡県; 香川県; 高知県; 鳥取県; 鹿児島県."
            ai_context: "Synonyms: 都道府県"
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"synonyms\": [\"都道府県\"]}"
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
          - name: PREFECTURE_NAME_ZH
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: PREFECTURE_NAME_ZH
            dimension: {}
            description: Prefecture name in Chinese.
            ai_context: "Synonyms: 都道府县"
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"synonyms\": [\"都道府县\"]}"
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
      - name: PREFECTURE_VALUE
        source: GLP.SEMANTIC.SV_JP_PREFECTURE_VALUE
        primary_key:
          - PRODUCT_ID
          - CARE_SETTING_ID
          - PREFECTURE_CODE
          - CLASS_ID
        description: "Values by prefecture of the issuing medical institution. Masked cells are left out, so sums are lower bounds. One row per product and therapeutic class of any of its substances, including all broader classes (skos:broader*): filter or group by one class, or use the *_all metrics, which count each product once (the top class)."
        fields:
          - name: CARE_SETTING_ID
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: CARE_SETTING_ID
            dimension: {}
            description: "outpatient-external (community pharmacy, 院外), outpatient-internal (dispensed in-house, 院内) or inpatient (入院)."
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
          - name: CLASS_ID
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: CLASS_ID
            dimension: {}
            description: Therapeutic class key.
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
          - name: PREFECTURE_CODE
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: PREFECTURE_CODE
            dimension: {}
            description: "JIS X 0401 code, 01-47."
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
          - name: PRODUCT_ID
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: PRODUCT_ID
            dimension: {}
            description: Product key (receipt code).
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
          - name: QUANTITY
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: QUANTITY
            description: Dispensed quantity in the product's dispensing unit. Absent when NDB masked the cell; the observation then carries sdmx-attribute:confStatus sdmx-code:confStatus-C.
            ai_context: "Synonyms: 処方数量"
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"synonyms\": [\"処方数量\"]}"
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
          - name: VALUE_YEN
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: VALUE_YEN
            description: "Quantity times the NHI price, in yen."
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
      - name: PRODUCT
        source: GLP.SEMANTIC.SV_JP_PRODUCT
        primary_key:
          - PRODUCT_ID
        description: "A drug product as named in claims data: in Part D (CMS Brnd_Name, e.g. Jardiance; unbranded generics appear under their generic name), or in NDB Open Data, where each strength is its own product with a receipt code and a YJ code (e.g. ジャディアンス錠10mg). NDB Open Data products at strength level."
        ai_context: "Synonyms: medicinal product, 药品"
        fields:
          - name: ACTIVE_SUBSTANCES
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: ACTIVE_SUBSTANCES
            dimension: {}
            description: "Substance name in English. Active substances in English, joined with ' + ' for combination products."
            ai_context: "Synonyms: substance"
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"synonyms\": [\"substance\"]}"
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
          - name: ACTIVE_SUBSTANCES_JA
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: ACTIVE_SUBSTANCES_JA
            dimension: {}
            description: "Substance name in Japanese. Active substances in Japanese, joined with '・'."
            ai_context: "Synonyms: 有効成分"
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"synonyms\": [\"有効成分\"]}"
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
          - name: COMPANY
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: COMPANY
            dimension: {}
            description: "Links a national company (e.g. the Japanese marketing authorization holder 日本ベーリンガーインゲルハイム) to its corporate group as identified by GLEIF. For market shares by company: the corporate group (GLEIF ultimate parent, the same company as in the US data) where known, else the marketing authorization holder. Values: VIATRIS INC. (also: Viatris Healthcare G.K., ヴィアトリス・ヘルスケア, Mylan Pharmaceuticals Inc.); MERCK & CO., INC. (also: MSD K.K., ＭＳＤ, Merck Sharp & Dohme LLC); C.H. Boehringer Sohn AG & Co. KG (also: Nippon Boehringer Ingelheim Co., Ltd., 日本ベーリンガーインゲルハイム, Boehringer Ingelheim Pharmaceuticals, Inc.); NOVO NORDISK A/S (also: Novo Nordisk Pharma Ltd., ノボ ノルディスク ファーマ, Novo Nordisk Inc.); SANOFI (also: Sanofi K.K., サノフィ, Sanofi-Aventis U.S. LLC, Sanofi US Services Inc.); ELI LILLY AND COMPANY (also: Eli Lilly Japan K.K., 日本イーライリリー); ASTRAZENECA PLC (also: AstraZeneca K.K., アストラゼネカ, AstraZeneca AB); otherwise the marketing authorization holder's own name."
            ai_context: "Synonyms: part of corporate group"
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"synonyms\": [\"part of corporate group\"]}"
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
          - name: COMPANY_JA
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: COMPANY_JA
            dimension: {}
            description: "The company in Japanese: the corporate group where known, else the holder. Values: ヴィアトリス (also: ヴィアトリス・ヘルスケア); MSD (also: ＭＳＤ); ベーリンガーインゲルハイム (also: 日本ベーリンガーインゲルハイム); ノボノルディスク (also: ノボ ノルディスク ファーマ); サノフィ (also: ); イーライリリー・アンド・カンパニー (also: 日本イーライリリー); アストラゼネカ (also: ); otherwise the marketing authorization holder's own name."
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
          - name: DISPENSING_UNIT
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: DISPENSING_UNIT
            dimension: {}
            description: "The unit in which quantities are counted (錠 tablet, キット kit, 筒 cartridge ...). Quantities in different units cannot be added."
            ai_context: "Synonyms: 単位"
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"synonyms\": [\"単位\"]}"
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
          - name: IS_COMBINATION
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: IS_COMBINATION
            dimension: {}
            description: Is combination product.
            ai_context: "Synonyms: is combination product, 配合剤, 复方制剂"
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"synonyms\": [\"is combination product\", \"配合剤\", \"复方制剂\"]}"
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
          - name: IS_GENERIC
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: IS_GENERIC
            dimension: {}
            description: Generic (後発医薬品) according to NDB Open Data's 後発品区分; biosimilars count as generics. Generics priced like their originator (most metformin 'MT' generics) are not flagged.
            ai_context: "Synonyms: 後発品"
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"synonyms\": [\"後発品\"]}"
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
          - name: IS_GLP1_PRODUCT
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: IS_GLP1_PRODUCT
            dimension: {}
            description: "A medicinal product containing a substance in the GLP-1 receptor agonist class (including dual GIP/GLP-1 agonists), alone or in combination, whatever its Japanese therapeutic category (249 or 396)."
            ai_context: "Synonyms: GLP-1 receptor agonist product, GLP-1受容体作動薬製剤, GLP-1受体激动剂产品"
            custom_extensions:
              - vendor_name: SNOWFLAKE
                data: "{\"synonyms\": [\"GLP-1 receptor agonist product\", \"GLP-1受容体作動薬製剤\", \"GLP-1受体激动剂产品\"]}"
              - vendor_name: SNOWFLAKE
                data: "{\"access_modifier\":\"public_access\"}"
          - name: IS_ORIGINATOR
            expression:
              dialects:
                - dialect: SNOWFLAKE
                  expression: IS_ORIGINATOR
            dimension: {}
            description: "Flagged 先発品 (originator) in the NHI price list. Neither generic nor originator: older products that predate the distinction and unified-name listings."
            ai_context: "Synonyms: 先発品"
            custom_extensions:
              - vendor_name: SNOWFLAKE
