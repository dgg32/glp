    metrics:
      - name: AGE_75PLUS_VALUE_SHARE
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: "SUM(sex_age_value.value_yen_age75plus) / NULLIF(SUM(sex_age_value.value_yen), 0)"
        description: Share (0 to 1) of the value dispensed to patients aged 75 and over (後期高齢者).
        custom_extensions:
          - vendor_name: SNOWFLAKE
            data: "{\"access_modifier\":\"public_access\"}"
      - name: AGE_CLASS_VALUE_YEN
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: SUM(sex_age_value.value_yen)
        description: Value in yen of a therapeutic class by sex and age band. Filter or group by one class.
        custom_extensions:
          - vendor_name: SNOWFLAKE
            data: "{\"access_modifier\":\"public_access\"}"
      - name: AGE_VALUE_YEN_ALL
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: SUM(CASE WHEN sex_age_value.class_id = 'DrugsUsedInDiabetes' THEN sex_age_value.value_yen END)
        description: "Value in yen of all drugs used in diabetes by sex and age band, each product counted once."
        custom_extensions:
          - vendor_name: SNOWFLAKE
            data: "{\"access_modifier\":\"public_access\"}"
      - name: CLASS_MARKET_SHARE
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: "SUM(national_value.value_yen) / NULLIF(MAX(national_value.class_total_value_yen), 0)"
        description: "Share (0 to 1) of the class's national value, for one class at a time. Grouped or filtered by product.company it is the company's market share in the class: the denominator stays the whole class whatever the filter on products or companies (it covers all care settings)."
        custom_extensions:
          - vendor_name: SNOWFLAKE
            data: "{\"access_modifier\":\"public_access\"}"
      - name: CLASS_VALUE_YEN
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: SUM(national_value.value_yen)
        description: "Value in yen of the products in a therapeutic class (including narrower classes), national totals. Filter or group by one class; a combination product counts in each of its classes."
        custom_extensions:
          - vendor_name: SNOWFLAKE
            data: "{\"access_modifier\":\"public_access\"}"
      - name: FEMALE_VALUE_SHARE
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: "SUM(sex_age_value.value_yen_female) / NULLIF(SUM(sex_age_value.value_yen), 0)"
        description: Share (0 to 1) of the value dispensed to female patients.
        custom_extensions:
          - vendor_name: SNOWFLAKE
            data: "{\"access_modifier\":\"public_access\"}"
      - name: MARKET_SHARE
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: "SUM(national_value.value_yen) / NULLIF(MAX(national_value.market_total_value_yen), 0)"
        description: "Share (0 to 1) of the national value of all drugs used in diabetes, whatever the filter on classes, products or companies (it covers all care settings). By class: a class's share of the market."
        custom_extensions:
          - vendor_name: SNOWFLAKE
            data: "{\"access_modifier\":\"public_access\"}"
      - name: MONTH_CLASS_VALUE_YEN
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: SUM(month_value.value_yen)
        description: Value in yen of a therapeutic class by month. Filter or group by one class.
        custom_extensions:
          - vendor_name: SNOWFLAKE
            data: "{\"access_modifier\":\"public_access\"}"
      - name: MONTH_GENERIC_QUANTITY_SHARE
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: "SUM(month_value.generic_quantity) / NULLIF(SUM(month_value.quantity), 0)"
        description: Generic share (0 to 1) of the dispensed quantity. Meaningful within one class only; group or filter by class and month.
        custom_extensions:
          - vendor_name: SNOWFLAKE
            data: "{\"access_modifier\":\"public_access\"}"
      - name: MONTH_VALUE_YEN_ALL
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: SUM(CASE WHEN month_value.class_id = 'DrugsUsedInDiabetes' THEN month_value.value_yen END)
        description: "Value in yen of all drugs used in diabetes by month, each product counted once."
        custom_extensions:
          - vendor_name: SNOWFLAKE
            data: "{\"access_modifier\":\"public_access\"}"
      - name: PREFECTURE_CLASS_VALUE_YEN
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: SUM(prefecture_value.value_yen)
        description: Value in yen of a therapeutic class by prefecture. Filter or group by one class.
        custom_extensions:
          - vendor_name: SNOWFLAKE
            data: "{\"access_modifier\":\"public_access\"}"
      - name: PREFECTURE_SGLT2_VALUE_SHARE
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: "SUM(CASE WHEN prefecture_value.class_id = 'SGLT2Inhibitor' THEN prefecture_value.value_yen END) / NULLIF(SUM(CASE WHEN prefecture_value.class_id = 'DrugsUsedInDiabetes' THEN prefecture_value.value_yen END), 0)"
        description: "Share (0 to 1) of Sodium-glucose co-transporter 2 (SGLT2) inhibitors in the value of all drugs used in diabetes (from the definition of dm:SGLT2Product: products with an SGLT2 inhibitor, alone or in combination)."
        custom_extensions:
          - vendor_name: SNOWFLAKE
            data: "{\"access_modifier\":\"public_access\"}"
      - name: PREFECTURE_VALUE_YEN_ALL
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: SUM(CASE WHEN prefecture_value.class_id = 'DrugsUsedInDiabetes' THEN prefecture_value.value_yen END)
        description: "Value in yen of all drugs used in diabetes by prefecture, each product counted once."
        custom_extensions:
          - vendor_name: SNOWFLAKE
            data: "{\"access_modifier\":\"public_access\"}"
      - name: PRODUCT_COUNT
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: COUNT(DISTINCT product.product_id)
        description: Number of distinct products (strength level).
        custom_extensions:
          - vendor_name: SNOWFLAKE
            data: "{\"access_modifier\":\"public_access\"}"
      - name: TOTAL_VALUE_YEN
        expression:
          dialects:
            - dialect: SNOWFLAKE
              expression: SUM(CASE WHEN national_value.class_id = 'DrugsUsedInDiabetes' THEN national_value.value_yen END)
        description: "Value in yen of all drugs used in diabetes, each product counted once (national totals)."
        custom_extensions:
          - vendor_name: SNOWFLAKE
            data: "{\"access_modifier\":\"public_access\"}"
    custom_extensions:
      - vendor_name: SNOWFLAKE
        data: "{\"module_custom_instructions\": {\"sql_generation\": \"Answer in yen (value_yen metrics), never by adding quantities across products. The four fact datasets are four breakdowns of the same national figures: never combine them; use national_value unless the question is by prefecture, month, or sex and age. Every fact row is one product in one therapeutic class, broader classes included: for all diabetes drugs use the *_all metrics, which count each product once (they handle the top class internally: never filter class_id yourself to get all drugs); for a class, filter or group by one class. 'By drug class' means therapeutic_class.is_drug_class = TRUE. A class's share of the market: market_share by class. A company's market share in a class: class_market_share with product.company and that class (never divide by the company's own total). 'Single-ingredient' means NOT product.is_combination. Prefecture, month and age figures are lower bounds (masked cells). Names exist in English, Japanese (*_ja) and Chinese (*_zh): answer with the names in the language of the question.\"}, \"verified_queries\": [{\"name\": \"jp_class_share_yen\", \"question\": \"What share of Japan's diabetes drug value does each drug class have, for single-ingredient products?\", \"sql\": \"SELECT * FROM SEMANTIC_VIEW(GLP.SEMANTIC.JAPAN_MARKET_OSI DIMENSIONS therapeutic_class.class_name METRICS class_value_yen, market_share WHERE therapeutic_class.class_id IN ('Insulin', 'Biguanide', 'Sulfonylurea', 'Thiazolidinedione', 'DPP4Inhibitor', 'AlphaGlucosidaseInhibitor', 'Glinide', 'Glimin', 'SGLT2Inhibitor', 'GLP1ReceptorAgonist') AND NOT product.is_combination) ORDER BY class_value_yen DESC\", \"verified_at\": 1793404800, \"use_as_onboarding_question\": true}, {\"name\": \"jp_company_share_sglt2_dpp4\", \"question\": \"Which companies lead the SGLT2 inhibitor and DPP-4 inhibitor markets in Japan by value?\", \"sql\": \"SELECT * FROM SEMANTIC_VIEW(GLP.SEMANTIC.JAPAN_MARKET_OSI DIMENSIONS therapeutic_class.class_name, product.company METRICS class_value_yen, class_market_share WHERE therapeutic_class.class_id IN ('SGLT2Inhibitor', 'DPP4Inhibitor')) ORDER BY class_name, class_value_yen DESC\", \"verified_at\": 1793404800, \"use_as_onboarding_question\": true}, {\"name\": \"jp_age_profile_by_class\", \"question\": \"What share of each drug class's value goes to patients aged 75 and over, and to women?\", \"sql\": \"SELECT * FROM SEMANTIC_VIEW(GLP.SEMANTIC.JAPAN_MARKET_OSI DIMENSIONS therapeutic_class.class_name METRICS age_class_value_yen, age_75plus_value_share, female_value_share WHERE therapeutic_class.class_id IN ('Insulin', 'Biguanide', 'Sulfonylurea', 'Thiazolidinedione', 'DPP4Inhibitor', 'AlphaGlucosidaseInhibitor', 'Glinide', 'Glimin', 'SGLT2Inhibitor', 'GLP1ReceptorAgonist')) ORDER BY age_75plus_value_share DESC\", \"verified_at\": 1793404800, \"use_as_onboarding_question\": false}, {\"name\": \"jp_generic_share_by_month\", \"question\": \"長期収載品の選定療養が始まった2024年10月の前後で、院外処方の後発品の割合は薬効群ごとに毎月どう変わった？\", \"sql\": \"SELECT * FROM SEMANTIC_VIEW(GLP.SEMANTIC.JAPAN_MARKET_OSI DIMENSIONS therapeutic_class.class_name, month_value.month METRICS month_generic_quantity_share WHERE month_value.care_setting_id = 'outpatient-external' AND NOT product.is_combination AND therapeutic_class.class_id IN ('Biguanide', 'Sulfonylurea', 'Thiazolidinedione', 'DPP4Inhibitor', 'AlphaGlucosidaseInhibitor', 'Glinide')) ORDER BY class_name, month\", \"verified_at\": 1793404800, \"use_as_onboarding_question\": false}, {\"name\": \"jp_glp1_monthly_uptake\", \"question\": \"How did the monthly value of each GLP-1 receptor agonist substance develop in Japan?\", \"sql\": \"SELECT * FROM SEMANTIC_VIEW(GLP.SEMANTIC.JAPAN_MARKET_OSI DIMENSIONS month_value.month, product.active_substances METRICS month_class_value_yen WHERE therapeutic_class.class_id = 'GLP1ReceptorAgonist' AND NOT product.is_combination) ORDER BY month, month_class_value_yen DESC\", \"verified_at\": 1793404800, \"use_as_onboarding_question\": false}, {\"name\": \"jp_sglt2_share_by_prefecture\", \"question\": \"都道府県別のSGLT2阻害薬のシェアは？\", \"sql\": \"SELECT * FROM SEMANTIC_VIEW(GLP.SEMANTIC.JAPAN_MARKET_OSI DIMENSIONS prefecture.prefecture_name_ja METRICS prefecture_sglt2_value_share, prefecture_value_yen_all) ORDER BY prefecture_sglt2_value_share DESC\", \"verified_at\": 1793404800, \"use_as_onboarding_question\": true}, {\"name\": \"jp_glp1_products_by_category\", \"question\": \"GLP-1受容体作動薬製剤は薬効分類ごとにいくつある？\", \"sql\": \"SELECT * FROM SEMANTIC_VIEW(GLP.SEMANTIC.JAPAN_MARKET_OSI DIMENSIONS jp_drug_class.jp_class_name_ja METRICS product_count WHERE product.is_glp1_product) ORDER BY product_count DESC\", \"verified_at\": 1793404800, \"use_as_onboarding_question\": false}]}"
