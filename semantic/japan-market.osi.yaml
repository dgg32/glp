      description: Product key (receipt code).
    - name: care_setting_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: CARE_SETTING_ID
      dimension:
        is_time: false
      description: outpatient-external (community pharmacy, 院外), outpatient-internal (dispensed in-house, 院内) or
        inpatient (入院).
    - name: class_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: CLASS_ID
      dimension:
        is_time: false
      description: Therapeutic class key.
    - name: sex_age_code
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: SEX_AGE_CODE
      dimension:
        is_time: false
      description: "F or M with the band's minimum age, e.g. F75."
    - name: quantity
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: QUANTITY
      description: "Dispensed quantity in the product's dispensing unit. Absent when NDB masked the cell; the observation\
        \ then carries sdmx-attribute:confStatus sdmx-code:confStatus-C."
    - name: value_yen_age75plus
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: VALUE_YEN_AGE75PLUS
      description: value_yen of patients aged 75 and over (後期高齢者), else 0.
    - name: value_yen_female
