        - dialect: ANSI_SQL
          expression: PRODUCT_ID
      dimension:
        is_time: false
      description: The 9-digit drug code of the claims (receipt) processing system (医薬品コード), the key of NDB Open
        Data.
      ai_context: "Synonyms: receipt code, レセプト電算処理システム用コード"
      custom_extensions:
