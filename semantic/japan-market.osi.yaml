# Generated by scripts/build_osi.py from the ontology. Do not edit.
# Apache Ossie (OSI) 0.1.1, validated against semantic/schema/osi-0.1.1.schema.json.
version: 0.1.1
semantic_model:
- name: JAPAN_MARKET_OSI
  description: "Diabetes drugs dispensed in Japan, generated from the diabetes-market ontology 0.5.2. NDB Open Data,\
    \ 11th release: FY2024 (April 2024 - March 2025), all of Japan, all ages. Quantities are dispensed tablets,\
    \ pens or kits, not patients or prescriptions, and cannot be added across products; values are quantity times\
    \ the NHI price (price list of 2026-09-02), in yen. Cells below 1,000 (oral) or 400 (injection) are masked.\
    \ The prefecture is where the claim was issued. No prescribers or specialties exist for Japan."
  ai_context: "Answer in yen (value_yen metrics), never by adding quantities across products. The four fact datasets\
    \ are four breakdowns of the same national figures: never combine them; use national_value unless the question\
    \ is by prefecture, month, or sex and age. Every fact row is one product in one therapeutic class, broader classes\
    \ included: for all diabetes drugs use the *_all metrics, which count each product once (they handle the top\
    \ class internally: never filter class_id yourself to get all drugs); for a class, filter or group by one class.\
    \ 'By drug class' means therapeutic_class.is_drug_class = TRUE. A class's share of the market: market_share\
    \ by class. A company's market share in a class: class_market_share with product.company and that class (never\
    \ divide by the company's own total). 'Single-ingredient' means NOT product.is_combination. Prefecture, month\
    \ and age figures are lower bounds (masked cells). Names exist in English, Japanese (*_ja) and Chinese (*_zh):\
    \ answer with the names in the language of the question."
  datasets:
  - name: national_value
    source: GLP.SEMANTIC.SV_JP_NATIONAL_VALUE
    primary_key:
    - PRODUCT_ID
    - CARE_SETTING_ID
    - CLASS_ID
    description: "National totals (総計) per product and care setting, FY2024. Use it unless the question is by prefecture,\
      \ month or sex and age. Products whose whole row NDB masked are left out. One row per product and therapeutic\
      \ class of any of its substances, including all broader classes (skos:broader*): filter or group by one class,\
      \ or use the *_all metrics, which count each product once (the top class)."
    fields:
    - name: product_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: PRODUCT_ID
      dimension:
        is_time: false
      description: Product key (receipt code).
    - name: care_setting_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: CARE_SETTING_ID
      dimension:
        is_time: false
      description: outpatient-external (community pharmacy, 院外), outpatient-internal (dispensed in-house, 院内) or
        inpatient (入院).
    - name: class_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: CLASS_ID
      dimension:
        is_time: false
      description: Therapeutic class key.
    - name: quantity
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: QUANTITY
      description: "The national total of the row (総計). Unmasked unless the whole product is below the masking threshold\
        \ in that care setting; then the slice carries sdmx-attribute:confStatus instead."
      ai_context: "Synonyms: total quantity, 総計（処方数量）"
      custom_extensions:
      - vendor_name: SNOWFLAKE
        data: "{\"synonyms\": [\"total quantity\", \"総計（処方数量）\"]}"
    - name: class_total_value_yen
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: CLASS_TOTAL_VALUE_YEN
      description: "The national value of the row's class (all products, all care settings), repeated on every row:\
        \ the denominator of class_market_share."
    - name: market_total_value_yen
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: MARKET_TOTAL_VALUE_YEN
      description: "The national value of all diabetes drugs, repeated on every row: the denominator of market_share."
    - name: value_yen
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: VALUE_YEN
      description: Quantity times the NHI price, in yen.
  - name: prefecture_value
    source: GLP.SEMANTIC.SV_JP_PREFECTURE_VALUE
    primary_key:
    - PRODUCT_ID
    - CARE_SETTING_ID
    - PREFECTURE_CODE
    - CLASS_ID
    description: "Values by prefecture of the issuing medical institution. Masked cells are left out, so sums are\
      \ lower bounds. One row per product and therapeutic class of any of its substances, including all broader\
      \ classes (skos:broader*): filter or group by one class, or use the *_all metrics, which count each product\
      \ once (the top class)."
    fields:
    - name: product_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: PRODUCT_ID
      dimension:
        is_time: false
      description: Product key (receipt code).
    - name: care_setting_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: CARE_SETTING_ID
      dimension:
        is_time: false
      description: outpatient-external (community pharmacy, 院外), outpatient-internal (dispensed in-house, 院内) or
        inpatient (入院).
    - name: class_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: CLASS_ID
      dimension:
        is_time: false
      description: Therapeutic class key.
    - name: prefecture_code
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: PREFECTURE_CODE
      dimension:
        is_time: false
      description: JIS X 0401 code, 01-47.
    - name: quantity
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: QUANTITY
      description: "Dispensed quantity in the product's dispensing unit. Absent when NDB masked the cell; the observation\
        \ then carries sdmx-attribute:confStatus sdmx-code:confStatus-C."
      ai_context: "Synonyms: 処方数量"
      custom_extensions:
      - vendor_name: SNOWFLAKE
        data: "{\"synonyms\": [\"処方数量\"]}"
    - name: value_yen
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: VALUE_YEN
      description: Quantity times the NHI price, in yen.
  - name: month_value
    source: GLP.SEMANTIC.SV_JP_MONTH_VALUE
    primary_key:
    - PRODUCT_ID
    - CARE_SETTING_ID
    - MONTH
    - CLASS_ID
    description: "Values by month of care. Masked cells are left out, so sums are lower bounds. One row per product\
      \ and therapeutic class of any of its substances, including all broader classes (skos:broader*): filter or\
      \ group by one class, or use the *_all metrics, which count each product once (the top class)."
    fields:
    - name: product_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: PRODUCT_ID
      dimension:
        is_time: false
      description: Product key (receipt code).
    - name: care_setting_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: CARE_SETTING_ID
      dimension:
        is_time: false
      description: outpatient-external (community pharmacy, 院外), outpatient-internal (dispensed in-house, 院内) or
        inpatient (入院).
    - name: class_id
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: CLASS_ID
      dimension:
        is_time: false
      description: Therapeutic class key.
    - name: month
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: MONTH
      dimension:
        is_time: true
      description: Month of care. First day of the month of care, 2024-04 to 2025-03.
      ai_context: "Synonyms: month of care, 診療月"
      custom_extensions:
      - vendor_name: SNOWFLAKE
        data: "{\"synonyms\": [\"month of care\", \"診療月\"]}"
    - name: quantity
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: QUANTITY
      description: "Dispensed quantity in the product's dispensing unit. Absent when NDB masked the cell; the observation\
        \ then carries sdmx-attribute:confStatus sdmx-code:confStatus-C."
    - name: generic_quantity
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: GENERIC_QUANTITY
      description: Quantity of products flagged generic (reimbursement definition), else 0. Comparable with quantity
        within one class only.
    - name: value_yen
      expression:
        dialects:
        - dialect: ANSI_SQL
          expression: VALUE_YEN
      description: Quantity times the NHI price, in yen.
  - name: sex_age_value
    source: GLP.SEMANTIC.SV_JP_SEX_AGE_VALUE
    primary_key:
    - PRODUCT_ID
    - CARE_SETTING_ID
    - SEX_AGE_CODE
    - CLASS_ID
    description: "Values by sex and five-year age band of the patient. Masked cells are left out, so sums are lower\
      \ bounds. One row per product and therapeutic class of any of its substances, including all broader classes\
